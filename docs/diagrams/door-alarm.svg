<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1125 790" role="img" aria-labelledby="title desc">
<title id="title">Skematik alarm pintu ESP32</title>
<desc id="desc">Fotodioda ke D34, switch button ke D21, buzzer melalui KN2222A ke D22. Laser hanya terhubung secara optik.</desc>
<rect width="1125" height="790" fill="#fff"/>
<style>text{font-family:system-ui,sans-serif;fill:#183047} .wire{stroke:#007567;stroke-width:2.1;fill:none;stroke-linejoin:round} .part{stroke:#183047;stroke-width:2;fill:none;stroke-linejoin:round} .net{fill:#006759;font:600 12px ui-monospace,monospace} .note{font-size:11px} .ref{font:600 11px ui-monospace,monospace} .heading{font-weight:650;font-size:16px}</style>
<path d="M40 77H1085 M40 722H1085" stroke="#c5d2d7"/>
<text x="40" y="60" class="" font-size="29" font-weight="750">Alarm pintu ESP32</text>
<text x="1085" y="60" class="net" text-anchor="end">SKEMATIK · PROTOTIPE MEJA</text>
<text x="40" y="115" class="heading" >01  Penerima berkas</text>
<text x="40" y="450" class="heading" >02  Switch button</text>
<text x="725" y="115" class="heading" >03  Driver buzzer</text>
<text x="40" y="140" class="note" >Laser merah → D1 (optik)</text>
<text x="725" y="140" class="note" >VIN diukur 4,5 V saat buzzer diuji.</text>
<text x="890" y="350" class="note" >Garis dioda ke VIN</text>
<text x="925" y="555" class="note" >B ← D22</text>
<text x="925" y="590" class="note" >E → GND</text>
<text x="925" y="625" class="note" >C → BZ1 negatif</text>
<text x="425" y="520" class="note" >USB-C menyuplai board.</text>
<text x="425" y="545" class="note" >VIN ≠ 3V3.</text>
<text x="40" y="750" class="note" >Prototipe meja | Laser tidak terhubung secara listrik ke ESP32.</text>
<text x="1085" y="750" class="net" text-anchor="end">GPIO 34 / 21 / 22</text>
